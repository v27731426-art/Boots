name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip sources
        run: unzip -q ragebots-src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        run: gradle build --no-daemon --stacktrace
        working-directory: ragebots
      - uses: actions/upload-artifact@v4
        with:
          name: ragebots-jar
          path: |
            ragebots/build/libs/*.jar
            !ragebots/build/libs/*-dev*.jar
